<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CRAFT</title>
  <link rel="stylesheet" href="/static/craft.css">
</head>
<body class="signin-page">
  <form class="signin" method="post" action="/login">
    <h1>CRAFT</h1>
    <p class="sub">Governance, risk and compliance</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" style="width:100%">Sign in</button>
    <p class="small muted" style="margin-top:20px;margin-bottom:0">
      Every sign-in, successful or not, is written to the audit log.
    </p>
  </form>
</body>
</html>
