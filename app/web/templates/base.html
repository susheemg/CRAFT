<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CRAFT{% endblock %}</title>
  <link rel="stylesheet" href="/static/craft.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231F3A70'/><text x='16' y='23' font-family='Arial' font-size='18' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
</head>
<body>
<header class="masthead">
  <a class="brand" href="/">
    <span class="brand-mark">C</span>
    <span class="brand-text">CRAFT</span>
  </a>
  <nav class="nav">
    <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
    <a href="/compliance" class="{{ 'active' if active == 'compliance' }}">Compliance</a>
    <a href="/risks" class="{{ 'active' if active == 'risks' }}">Risk</a>
    <a href="/approvals" class="{{ 'active' if active == 'approvals' }}">Approvals</a>
    <a href="/operations" class="{{ 'active' if active == 'operations' }}">Operations</a>
    {% if can('admin.llm.view') %}<a href="/admin/ai" class="{{ 'active' if active == 'admin' }}">AI</a>{% endif %}
    {% if can('sec.auditlog.read') %}<a href="/audit" class="{{ 'active' if active == 'audit' }}">Audit</a>{% endif %}
  </nav>
  <div class="principal">
    <span class="principal-name">{{ principal.display }}</span>
    <a class="signout" href="/logout">Sign out</a>
  </div>
</header>

<main class="page">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>CRAFT {{ version }}</span>
  <span><a href="/docs">API reference</a> · <a href="/mcp/manifest">MCP manifest</a></span>
</footer>
</body>
</html>
